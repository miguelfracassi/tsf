<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urna Eletrônica TSF</title>
<style>
:root{--pg:#ececec;--cas:#111;--scr:#fff;--ink:#000;--mut:#555;--key:#111;--ln:#000;color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#1c1c1c}}
:root[data-theme="dark"]{--pg:#1c1c1c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--pg);font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px}
.dev{width:min(980px,100%);display:grid;grid-template-columns:1fr 250px;gap:18px;padding:18px;border-radius:16px;background:var(--cas);border:1px solid #444}
.mes{grid-template-columns:1fr 230px}
.scr{background:var(--scr);border-radius:8px;min-height:470px;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:#000;border-bottom:2px solid #000;color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em}
.bd{flex:1;display:grid;grid-template-columns:1fr 170px;gap:14px;padding:18px 22px}
.bd.one{grid-template-columns:1fr;align-content:center;text-align:center}
.seu{font-size:13px;letter-spacing:.05em;color:var(--mut);margin:0 0 2px}
.cargo{font-size:36px;font-weight:800;margin:0 0 14px;line-height:1.1}
.bx{display:flex;gap:8px;margin-bottom:14px;justify-content:inherit}
.bx span{width:42px;height:56px;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;background:#fff}
.bx span.c{box-shadow:inset 0 -5px 0 #000}
.inf{font-size:19px;line-height:1.7;min-height:96px}
.inf b{display:inline-block;min-width:84px;color:var(--mut);font-weight:600}
.err{font-weight:800;min-height:24px;margin:4px 0}
.nulo{font-size:22px;font-weight:800;text-decoration:underline}
.branco{font-size:40px;font-weight:800;letter-spacing:.04em}
.ft{border-top:2px solid #000;margin:0 22px;padding:10px 0 14px;font-size:13px;line-height:1.9}
.ft i{font-style:normal;font-weight:800;padding:2px 8px;border:1px solid #000}
.g{background:#000;color:#fff}.o{background:#ccc;color:#000}.w{background:#fff;color:#000}
.fo{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut)}
.fo img{width:150px;height:180px;object-fit:cover;border:2px solid #000;background:#fff;margin-bottom:4px}
.fo svg{width:150px;height:180px;border:2px solid #000;background:#fff;margin-bottom:4px}
.big{font-size:min(13vw,78px);font-weight:800;letter-spacing:.08em;margin:10px 0}
.mut{color:var(--mut);font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;margin-right:6px}
.dot.on{background:#000}
.nm{font-size:26px;font-weight:800;margin:6px 0}
.cpf{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.cpf span{width:28px;height:40px;border:2px solid #000;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.cpf span.sp{width:10px;border:0;background:none}
.fim{flex:1;display:flex;align-items:center;justify-content:center;font-size:min(28vw,230px);font-weight:900;letter-spacing:.06em}
.kp{display:flex;flex-direction:column;gap:14px;justify-content:center}
.lg{font-size:11px;font-weight:700;color:#aaa;text-align:center;letter-spacing:.14em}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{height:52px;border:1px solid #666;border-radius:8px;background:#222;color:#fff;font:700 21px Arial;cursor:pointer}
.k:active{background:#555}
.k:focus-visible{outline:3px solid #fff;outline-offset:2px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k.a{height:58px;font-size:11px;letter-spacing:.04em;border:0}
.k.br{background:#fff;color:#000}.k.co{background:#bbb;color:#000}.k.cf{background:#000;color:#fff;border:2px solid #fff}
.rd{margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rd svg{width:90px;height:90px;background:#000;border-radius:8px;border:2px solid #666}
.tick small{display:block;font-size:12px;letter-spacing:.12em;color:var(--mut);font-weight:700}
#tk{min-height:52px;margin:8px 0}
.tk{display:flex;align-items:baseline;flex-wrap:wrap;gap:12px;animation:tk 2.2s ease-in-out both}
.tk .tn{font-size:30px;font-weight:800;text-transform:uppercase}
.tk .tnum{font-size:30px;font-weight:800;letter-spacing:.06em}
@keyframes tk{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tk{animation:none}}
@media(max-width:760px){.dev,.mes{grid-template-columns:1fr}.bd{grid-template-columns:1fr}.fo{display:none}.cargo{font-size:28px}.tk .tn,.tk .tnum{font-size:24px}}
</style>
</head>

let room=null,bc=null,CODE="",handlers={},keyFn=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function beep(f=880,d=120){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d/1000)}catch(e){}}
function on(t,fn){handlers[t]=fn}
function dispatch(t,d){if(handlers[t])handlers[t](d)}
const ME=Math.random().toString(36).slice(2,10),NTFY="https://ntfy.sh/tsf-urna-fracassi-";let es=null;
async function send(t,d){
  d=d||{};
  try{bc&&bc.postMessage({t,d})}catch(e){}
  try{if(CODE)fetch(NTFY+CODE,{method:"POST",body:JSON.stringify({t,d,id:ME})}).catch(()=>{})}catch(e){}
  try{room&&await room.emit(t,d)}catch(e){}
}
let SID="",LAST="",VIEW=null;
function openES(code){
  try{if(es)es.close();es=new EventSource(NTFY+code+"/sse");
    es.onopen=()=>dispatch("__open",{});
    es.onmessage=ev=>{try{const j=JSON.parse(ev.data);if(j.event!=="message")return;const m=JSON.parse(j.message);if(m.id===ME)return;dispatch(m.t,m.d||{})}catch(e){}}}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&CODE)openES(CODE)});
window.addEventListener("online",()=>{if(CODE)openES(CODE)});
window.addEventListener("pageshow",()=>{if(CODE)openES(CODE)});
function sendTela(){send("tela",{t:Date.now(),sid:SID,last:LAST,voting:!!VIEW,v:VIEW})}
async function connect(code){
  CODE=code;handlers={};
  try{bc=new BroadcastChannel("tsf"+code);bc.onmessage=e=>dispatch(e.data.t,e.data.d)}catch(e){}
  openES(code);
  try{
    const r=await claude.use("room");
    if(r){room=await r.join("tsf-"+code);
      ["hello","ack","liberar","iniciado","fim","tela","tecla","pedir"].forEach(t=>room.on(t,m=>dispatch(t,(m&&m.data)||{})));}
  }catch(e){console.error(e)}
}
document.addEventListener("keydown",e=>{if(keyFn&&keyFn(e))e.preventDefault()});
function press(k){if(keyFn)keyFn({key:k})}
function keypad(x=""){
  const d=n=>`<button class="k" data-k="${n}" aria-label="${n}">${n}</button>`;
  return `<div class="kp"><div class="dg">${[1,2,3,4,5,6,7,8,9].map(d).join("")}<span></span>${d(0)}<span></span></div>
  <div class="acts"><button class="k a br" data-k="b">BRANCO</button><button class="k a co" data-k="Backspace">CORRIGE</button><button class="k a cf" data-k="Enter">CONFIRMA</button></div>
  <div class="lg">URNA ELETRÔNICA TSF</div>${x}</div>`}
function dev(top,body,m){
  $.className="dev"+(m?" mes":"");
  $.innerHTML=`<div class="scr"><div class="top${m?" m":""}">${top}</div>${body}</div>
  ${keypad(m?`<div class="rd"><svg viewBox="0 0 90 90" aria-hidden="true">${DIGITAL("#fff")}</svg><div class="lg">LEITOR BIOMÉTRICO</div></div>`:"")}`;
  $.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{beep(500,50);press(b.dataset.k)});
}
function DIGITAL(c){let s="";for(let i=1;i<=7;i++)s+=`<path d="M${45-i*5} 70 V${40-i*2} a${i*5} ${i*5+4} 0 0 1 ${i*10} 0 V68" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="${i%2?"30 4":"50 3"}" stroke-linecap="round"/>`;return s}

function espelho(nome,v){
  const top=`<p class="seu">ELEITOR VOTANDO</p><p class="nm" style="font-size:22px;margin:0 0 10px">${esc(nome)}</p>`;
  if(!v)return `<div class="bd one"><div>${top}<p class="mut"><span class="dot on"></span>Aguardando a tela da urna…</p></div></div>`;
  if(v.fim)return `<div class="fim">FIM</div><div class="ft" style="text-align:center">O ELEITOR VOTOU</div>`;
  const [k,titulo,len]=CARGOS[v.i],dig=v.dig||"";
  const bx=Array.from({length:len},(_,j)=>`<span>${dig[j]||""}</span>`).join("");
  let info="",foto="";
  if(v.br)info=`<div class="branco">VOTO EM BRANCO</div>`;
  else if(dig.length===0)info=`<div class="mut">O eleitor ainda não digitou.</div>`;
  else if(dig.length<len)info=`<div class="mut">Digitando…</div>`;
  else{
    const x=NOMES[k].find(z=>z[0]===dig);
    if(x){info=`<div><b>Nome:</b> ${esc(x[1])}</div><div><b>Partido:</b> ${esc(x[2]||PARTIDOS[dig.slice(0,2)]||"")}</div><div><b>Número:</b> ${dig}</div>`;foto=x[3]?`<img src="${x[3]}" alt="Foto do candidato">`:FOTO}
    else info=`<div class="nulo">NÚMERO ERRADO<br>CANDIDATO INEXISTENTE</div><div class="nulo" style="margin-top:6px">VOTO NULO</div>`}
  return `<div class="bd"><div>${top}<p class="seu">VOTO PARA (${v.i+1}/${CARGOS.length})</p><p class="cargo">${titulo}</p>${v.br?"":`<div class="bx">${bx}</div>`}<div class="inf">${info}</div><div class="err">${esc(v.msg||"")}</div></div>
  <div class="fo">${foto?foto+(k==="sen"?"Senador":titulo.split(" (")[0]):""}</div></div>
  <div class="ft">Você pode digitar no teclado ao lado <b>pelo eleitor</b>.<br><i class="g">VERDE</i> confirma &nbsp; <i class="w">BRANCO</i> em branco &nbsp; <i class="o">LARANJA</i> corrige</div>`;
}
const mtop=(extra="")=>`TERMINAL DO MESÁRIO<span>${extra}</span>`;
/* ---------- MESÁRIO ---------- */
async function mesario(){
  const code=String(Math.floor(1000+Math.random()*9000));
  await connect(code);
  let linked=false,cpf="",found=null,stage="cpf",msg="",n=0,cur="",view=null,viewKey="",lastT=0;
  on("hello",()=>{linked=true;send("ack",{});render()});
  const voltar=()=>{stage="cpf";cpf="";found=null;msg="";cur="";view=null;viewKey="";render()};
  on("iniciado",()=>{if(stage==="liberando"){stage="votando";render()}});
  on("fim",()=>{if(stage==="liberando"||stage==="votando")voltar()});
  on("__open",()=>{if(linked)send("pedir",{})});
  on("tela",s=>{
    if(!s||(s.t||0)<lastT)return;lastT=s.t||lastT;
    if(stage!=="liberando"&&stage!=="votando")return;
    if(s.voting&&s.sid&&s.sid===cur){
      const k=JSON.stringify(s.v);
      if(k!==viewKey||stage==="liberando"){viewKey=k;view=s.v;stage="votando";render()}
    }else if(!s.voting&&cur&&s.last===cur){voltar()}
  });
  function render(){
    if(!linked){keyFn=null;
      dev(mtop("1/5 · CONEXÃO"),`<div class="bd one"><div><p class="seu">Digite este código na urna</p><div class="big">TSF - ${code}</div><p class="mut"><span class="dot"></span>Aguardando a urna conectar…</p></div></div>`,1);return}
    const t=` TSF - ${code}`;
    if(stage==="cpf"){
      const raw=cpf.padEnd(11,"·").split("");
      const d=raw.map((c,i)=>`<span>${c==="·"?"":c}</span>${i==2||i==5||i==8?'<span class="sp"></span>':""}`).join("");
      dev(mtop("2/5 · IDENTIFICAÇÃO"),`<div class="bd one"><div><p class="seu"><span class="dot on"></span>Urna conectada (${t.trim()})</p><p class="cargo" style="font-size:28px">Digite o CPF do eleitor</p><div class="cpf">${d}</div><div class="err">${msg}</div></div></div><div class="ft"><i class="g">CONFIRMA</i> pesquisar eleitor &nbsp; <i class="o">CORRIGE</i> apagar</div>`,1);
      keyFn=e=>{if(/^\d$/.test(e.key)&&cpf.length<11){cpf+=e.key;msg="";render();return true}
        if(e.key==="Backspace"){cpf=cpf.slice(0,-1);render();return true}
        if(e.key==="Enter"){if(cpf.length<11){msg="CPF incompleto";render();return true}
          if(CPFS[cpf]){found=CPFS[cpf];stage="achou";render()}else{msg="CPF não encontrado";cpf="";render()}return true}}
    }else if(stage==="achou"){
      dev(mtop("3/5 · CONFERÊNCIA"),`<div class="bd"><div><p class="seu">Eleitor encontrado</p><p class="nm">${esc(found[0])}</p><div class="inf"><div><b>Local:</b> ${esc(found[1])}</div><div><b>CPF:</b> ${cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4")}</div></div></div><div class="fo">${FOTO}Foto do eleitor</div></div><div class="ft"><i class="g">CONFIRMA</i> iniciar votação &nbsp; <i class="o">CORRIGE</i> voltar</div>`,1);
      keyFn=e=>{if(e.key==="Enter"){stage="dedo";render();return true}if(e.key==="Backspace"){stage="cpf";cpf="";render();return true}}
    }else if(stage==="dedo"){
      dev(mtop("4/5 · BIOMETRIA"),`<div class="bd one"><div><p class="nm">${esc(found[0])}</p><svg viewBox="0 0 90 90" width="130" height="130" aria-hidden="true">${DIGITAL("#000")}</svg><p style="font-size:21px;margin:6px 0">Coloque o dedo no leitor biométrico.</p></div></div><div class="ft"><i class="g">CONFIRMA</i> liberar a urna &nbsp; <i class="o">CORRIGE</i> voltar</div>`,1);
      const lib=()=>{const sid=Math.random().toString(36).slice(2);cur=sid;view=null;viewKey="";stage="liberando";beep(660,200);(function tick(){if(stage!=="liberando")return;send("liberar",{nome:found[0],sid:sid});if(++n<20)setTimeout(tick,1500)})();render()};
      keyFn=e=>{if(e.key==="Enter"){lib();return true}if(e.key==="Backspace"){stage="achou";render();return true}}
    }else{
      keyFn=e=>{const k=e.key;if(!(/^\d$/.test(k)||k==="Backspace"||k==="Enter"||k==="b"||k==="B"))return;
        if(view&&!view.fim)send("tecla",{k:(k==="B"?"b":k),id:Math.random().toString(36).slice(2)});return true};
      dev(mtop("5/5 · VOTAÇÃO"),espelho(found[0],view),1);
    }
  }
  render();
}
/* ---------- URNA ---------- */
function urna(){
  let c="",msg="";
  function render(){
    const b=[0,1,2,3].map(i=>`<span class="${i===c.length?"c":""}">${c[i]||""}</span>`).join("");
    dev("JUSTIÇA ELEITORAL<span>CONEXÃO</span>",`<div class="bd one"><div><p class="seu">Abra o terminal do mesário em outro aparelho e digite o código gerado</p><p class="cargo" style="margin-top:10px">TSF -</p><div class="bx" style="justify-content:center">${b}</div><div class="err">${msg}</div></div></div><div class="ft"><i class="g">CONFIRMA</i> conectar &nbsp; <i class="o">CORRIGE</i> apagar</div>`)}
  render();
  keyFn=e=>{if(/^\d$/.test(e.key)&&c.length<4){c+=e.key;msg="";render();return true}
    if(e.key==="Backspace"){c=c.slice(0,-1);render();return true}
    if(e.key==="Enter"){if(c.length<4){msg="Código incompleto";render()}else ligar(c);return true}}
}
async function ligar(code){
  keyFn=null;
  dev("JUSTIÇA ELEITORAL<span>CONEXÃO</span>",`<div class="bd one"><div><p class="seu">Conectando ao terminal</p><div class="big">TSF - ${code}</div></div></div>`);
  await connect(code);
  let ok=false,tries=0,voting=false;const usados=new Set();
  on("ack",()=>{if(ok)return;ok=true;espera()});
  on("liberar",d=>{if(voting||usados.has(d.sid))return;usados.add(d.sid);SID=d.sid;voting=true;[0,1000,2000].forEach(ms=>setTimeout(()=>send("iniciado",{}),ms));votar(d.nome||"ELEITOR")});
  const hi=()=>{if(ok)return;send("hello",{});if(++tries<30)setTimeout(hi,2000);else{dev("JUSTIÇA ELEITORAL<span>ERRO</span>",`<div class="bd one"><div><p class="nm">Não conectou</p><p class="mut">Confira o código, se o mesário está aberto e se os dois aparelhos têm internet.</p></div></div><div class="ft"><i class="g">CONFIRMA</i> tentar de novo</div>`);keyFn=e=>{if(e.key==="Enter"){urna();return true}}}};
  const vistas=new Set();
  on("tecla",d=>{if(!voting||!d||vistas.has(d.id))return;vistas.add(d.id);if(keyFn)keyFn({key:d.k})});
  on("pedir",()=>sendTela());
  setInterval(()=>{if(ok)sendTela()},8000);
  hi();
  function espera(){voting=false;keyFn=null;if(SID)LAST=SID;VIEW=null;setTimeout(sendTela,50);
    dev(`JUSTIÇA ELEITORAL<span>TSF - ${code}</span>`,`<div class="bd one"><div><p class="nm" style="font-size:34px">Aguardando eleitor</p><p class="mut"><span class="dot on"></span>Conectada ao terminal do mesário.<br>Aguarde a liberação.</p></div></div>`)}
  window.__espera=espera;
}
function votar(nome){
  let i=0,dig="",lista=[],msg="",br=false,tk=null;
  const cand=(k,n)=>NOMES[k].find(x=>x[0]===n);
  function stopTk(){if(tk){clearInterval(tk);tk=null}}
  function startTk(){stopTk();
    const L=NOMES[CARGOS[i][0]].filter(x=>!(i===3&&x[0]===lista[2]));let j=0;
    const show=()=>{const e=document.getElementById("tk");if(!e){stopTk();return}
      const x=L[j%L.length];e.innerHTML=`<div class="tk"><span class="tn">${esc(x[1])}</span><span class="tnum">- ${x[0]}</span></div>`;j++};
    show();tk=setInterval(show,2200)}
  const TICK=t=>`<div class="tick"><small>CANDIDATOS A ${t.toUpperCase()}</small><div id="tk"></div><small>DIGITE O NÚMERO DO SEU CANDIDATO</small></div>`;
  function render(){
    const [k,titulo,len]=CARGOS[i];
    const bx=Array.from({length:len},(_,j)=>`<span>${dig[j]||""}</span>`).join("");
    let info="",foto="";
    if(br)info=`<div class="branco">VOTO EM BRANCO</div>`;
    else if(dig.length===0)info=TICK(titulo);
    else if(dig.length===len){
      const x=cand(k,dig);
      if(x){info=`<div><b>Nome:</b> ${esc(x[1])}</div><div><b>Partido:</b> ${esc(x[2]||PARTIDOS[dig.slice(0,2)]||"")}</div><div><b>Número:</b> ${dig}</div>`;foto=x[3]?`<img src="${x[3]}" alt="Foto do candidato">`:FOTO}
      else info=`<div class="nulo">NÚMERO ERRADO<br>CANDIDATO INEXISTENTE</div><div class="nulo" style="margin-top:6px">VOTO NULO</div>`}
    dev(`JUSTIÇA ELEITORAL<span>ELEITOR: ${esc(nome)}</span>`,`<div class="bd"><div><p class="seu">SEU VOTO PARA</p><p class="cargo">${titulo}</p>${br?"":`<div class="bx">${bx}</div>`}<div class="inf">${info}</div><div class="err">${msg}</div></div>
    <div class="fo">${foto?foto+(k==="sen"?"Senador":titulo.split(" (")[0]):""}</div></div>
    <div class="ft">Aperte a tecla:<br><i class="g">VERDE</i> para CONFIRMAR &nbsp; <i class="w">BRANCO</i> para VOTAR EM BRANCO &nbsp; <i class="o">LARANJA</i> para CORRIGIR</div>`);
    if(!br&&dig.length===0)startTk();else stopTk();VIEW={i,dig,br,msg};sendTela()}
  function avancar(v){lista.push(v);beep(1000,250);dig="";msg="";br=false;i++;if(i>=CARGOS.length)fimVoto();else render()}
  function fimVoto(){
    keyFn=null;stopTk();VIEW={fim:true};sendTela();dev(`JUSTIÇA ELEITORAL<span>ELEITOR: ${esc(nome)}</span>`,`<div class="fim">FIM</div><div class="ft" style="text-align:center">VOTOU</div>`);
    beep(1200,900);setTimeout(()=>{[0,1000,2000].forEach(ms=>setTimeout(()=>send("fim",{}),ms));window.__espera&&window.__espera()},6000)}
  keyFn=e=>{
    const len=CARGOS[i][2];
    if(/^\d$/.test(e.key)&&dig.length<len&&!br){dig+=e.key;msg="";render();return true}
    if(e.key==="Backspace"){dig="";br=false;msg="";render();return true}
    if(e.key==="b"||e.key==="B"){if(dig.length){msg="Corrija antes de votar em branco"}else br=true;render();return true}
    if(e.key==="Enter"){
      if(br){avancar("branco");return true}
      if(dig.length===len){
        const ok=cand(CARGOS[i][0],dig);
        if(ok&&CARGOS[i][0]==="sen"&&i===3&&dig===lista[2]){msg="Candidato já escolhido na 1ª vaga";dig="";render();return true}
        avancar(ok?dig:"nulo")}
      return true}
  };
  render();
}
home();document.getElementById("m").onclick=()=>location.href="mesario.html";document.getElementById("u").onclick=()=>location.href="urna.html";
